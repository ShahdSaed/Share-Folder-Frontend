<button
  [type]="type"
  [disabled]="disabled || loading"
  [class]="'btn btn-' + variant + ' btn-' + size + (fullWidth ? ' btn-block' : '') + (loading ? ' is-loading' : '')"
  (click)="onClick($event)"
>
  @if (loading) {
    <span class="spinner" aria-hidden="true"></span>
  }
  <ng-content></ng-content>
</button>
